{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yangi parol — FOR CENTRE</title>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700&family=Oxanium:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  <link rel="stylesheet" href="{% static 'css/portal.css' %}" />
</head>
<body class="login-body">
  <div class="login-card">
    <span class="brand-mark">FC</span>
    <h1>Yangi parol o‘rnating</h1>
    <p class="login-lead">Birinchi kirish. Dashboard ochilishi uchun parolni almashtiring.</p>
    <form method="post" class="contact-form login-form">
      {% csrf_token %}
      <label>Yangi parol {{ form.new_password1 }}{% if form.new_password1.errors %}<span class="field-error">{{ form.new_password1.errors.0 }}</span>{% endif %}</label>
      <label>Takrorlang {{ form.new_password2 }}{% if form.new_password2.errors %}<span class="field-error">{{ form.new_password2.errors.0 }}</span>{% endif %}</label>
      {% if form.non_field_errors %}<p class="form-status is-error">{{ form.non_field_errors.0 }}</p>{% endif %}
      <button class="btn btn-primary" type="submit">Saqlash va davom etish</button>
    </form>
    <form method="post" action="{% url 'accounts:logout' %}" style="margin-top:1rem">{% csrf_token %}<button class="btn-mini ghost" type="submit">Chiqish</button></form>
  </div>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yangi parol — FOR CENTRE</title>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700&family=Oxanium:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  <link rel="stylesheet" href="{% static 'css/portal.css' %}" />
</head>
<body class="login-body">
  <div class="login-card">
    <a class="brand" href="{% url 'portal:landing' %}">
      <span class="brand-mark">FC</span>
      <span class="brand-text">FOR <strong>CENTRE</strong></span>
    </a>
    <h1>Yangi parol</h1>
    <p class="login-lead">Yangi parolingizni kiriting.</p>
    {% if messages %}{% for message in messages %}<div class="flash flash-{{ message.tags }}">{{ message }}</div>{% endfor %}{% endif %}
    <form method="post" class="contact-form login-form">
      {% csrf_token %}
      <label>Yangi parol {{ form.password1 }}{% if form.password1.errors %}<span class="field-error">{{ form.password1.errors.0 }}</span>{% endif %}</label>
      <label>Tasdiqlang {{ form.password2 }}{% if form.password2.errors %}<span class="field-error">{{ form.password2.errors.0 }}</span>{% endif %}</label>
      {% if form.non_field_errors %}<p class="form-status is-error">{{ form.non_field_errors.0 }}</p>{% endif %}
      <button class="btn btn-primary" type="submit">Parolni saqlash</button>
    </form>
  </div>
</body>
</html>

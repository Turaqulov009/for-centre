{% extends "portal/admin/admin_base.html" %}
{% block title %}{{ title }} — Admin{% endblock %}
{% block content %}
<section class="panel">
  <div class="panel-head"><div><p class="eyebrow">Kurslar</p><h2>{{ title }}</h2></div></div>
  <form method="post" class="contact-form grid-form" enctype="multipart/form-data">
    {% csrf_token %}
    <label>Nomi {{ form.title }}{% if form.title.errors %}<span class="field-error">{{ form.title.errors.0 }}</span>{% endif %}</label>
    <label>Slug {{ form.slug }}<small class="field-hint">Bo‘sh qoldirilsa avtomatik.</small></label>
    <label class="full">Qisqa tavsif {{ form.short_description }}</label>
    <label class="full">Tavsif {{ form.description }}</label>
    <label>Muqova {{ form.cover }}</label>
    <label>Fan {{ form.subject }}</label>
    <label>O‘qituvchi {{ form.teacher }}</label>
    <label>Davomiylik {{ form.duration }}</label>
    <label>Tartib {{ form.sort_order }}</label>
    <label class="check-inline">{{ form.is_published }} Chop etilgan</label>
    <label class="check-inline">{{ form.show_on_landing }} Landingda ko‘rsatish</label>
    <button class="btn btn-primary" type="submit">Saqlash</button>
    <a class="text-link" href="{% url 'portal:admin_courses' %}">Orqaga</a>
  </form>
</section>
{% endblock %}

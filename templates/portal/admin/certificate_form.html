{% extends "portal/admin/admin_base.html" %}
{% block title %}{{ title }} — Admin{% endblock %}
{% block content %}
<section class="panel">
  <div class="panel-head"><div><p class="eyebrow">Sertifikat</p><h2>{{ title }}</h2></div></div>
  <form method="post" enctype="multipart/form-data" class="contact-form grid-form">
    {% csrf_token %}
    <label>Student {{ form.student }}{% if form.student.errors %}<span class="field-error">{{ form.student.errors.0 }}</span>{% endif %}</label>
    <label>Kurs {{ form.course }}{% if form.course.errors %}<span class="field-error">{{ form.course.errors.0 }}</span>{% endif %}</label>
    <label class="full">Sarlavha {{ form.title }}{% if form.title.errors %}<span class="field-error">{{ form.title.errors.0 }}</span>{% endif %}</label>
    <label>Kod {{ form.certificate_code }}{% if form.certificate_code.help_text %}<small>{{ form.certificate_code.help_text }}</small>{% endif %}</label>
    <label>Fayl {{ form.file }}</label>
    <label class="check-inline">{{ form.is_published }} Chop etilgan</label>
    <button class="btn btn-primary" type="submit">Saqlash</button>
    <a class="text-link" href="{% url 'portal:admin_certificates' %}">Orqaga</a>
  </form>
</section>
{% endblock %}

{% extends "portal/admin/admin_base.html" %}
{% block title %}{{ title }} — Admin{% endblock %}
{% block content %}
<section class="panel">
  <div class="panel-head">
    <div>
      <p class="eyebrow">Bannerlar</p>
      <h2>{{ title }}</h2>
    </div>
  </div>
  <form method="post" class="contact-form grid-form" enctype="multipart/form-data">
    {% csrf_token %}
    <label>Sarlavha {{ form.title }}{% if form.title.errors %}<span class="field-error">{{ form.title.errors.0 }}</span>{% endif %}</label>
    <label class="full">Subtitle {{ form.subtitle }}</label>
    <label>Rasm {{ form.image }}</label>
    <label>Tugma matni {{ form.button_text }}</label>
    <label>Tugma URL {{ form.button_url }}</label>
    <label>Tartib {{ form.sort_order }}</label>
    <label class="check-inline">{{ form.is_active }} Aktiv</label>
    <button class="btn btn-primary" type="submit">Saqlash</button>
    <a class="text-link" href="{% url 'portal:admin_banners' %}">Orqaga</a>
  </form>
</section>
{% endblock %}

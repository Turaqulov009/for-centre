{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yangi user — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700&family=Oxanium:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  <link rel="stylesheet" href="{% static 'css/portal.css' %}" />
</head>
<body class="portal-body">
  <div class="app-shell portal-shell">
    <header class="topbar">
      <a class="brand" href="{% url 'portal:admin_dashboard' %}"><span class="brand-mark">FC</span><span class="brand-text">Admin Panel</span></a>
    </header>
    <aside class="sidebar"><nav class="sidebar-nav">{% include "portal/admin/_sidebar.html" %}</nav></aside>
    <main class="content portal-content">
      <section class="panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Users</p>
            <h2>Yangi foydalanuvchi</h2>
          </div>
        </div>
        <form method="post" class="contact-form grid-form">
          {% csrf_token %}
          <label>To‘liq ism {{ form.full_name }}{% if form.full_name.errors %}<span class="field-error">{{ form.full_name.errors.0 }}</span>{% endif %}</label>
          <label>Login (username) {{ form.username }}{% if form.username.help_text %}<small class="field-hint">{{ form.username.help_text }}</small>{% endif %}{% if form.username.errors %}<span class="field-error">{{ form.username.errors.0 }}</span>{% endif %}</label>
          <label>Email {{ form.email }}{% if form.email.help_text %}<small class="field-hint">{{ form.email.help_text }}</small>{% endif %}{% if form.email.errors %}<span class="field-error">{{ form.email.errors.0 }}</span>{% endif %}</label>
          <label>Telefon {{ form.phone }}</label>
          <label>Vaqtinchalik parol {{ form.temporary_password }}{% if form.temporary_password.help_text %}<small class="field-hint">{{ form.temporary_password.help_text }}</small>{% endif %}{% if form.temporary_password.errors %}<span class="field-error">{{ form.temporary_password.errors.0 }}</span>{% endif %}</label>
          <label>Role {{ form.role }}{% if form.role.errors %}<span class="field-error">{{ form.role.errors.0 }}</span>{% endif %}{% if not is_super_admin %}<small class="field-hint">Admin role faqat Super Admin yaratadi.</small>{% endif %}</label>
          <label class="check-inline">{{ form.is_active }} Aktiv</label>
          <button class="btn btn-primary" type="submit">Yaratish</button>
          <a class="text-link" href="{% url 'portal:admin_users' %}">Orqaga</a>
        </form>
      </section>
    </main>
  </div>
</body>
</html>

{% extends "portal/admin/admin_base.html" %}
{% block title %}{{ title }} — Admin{% endblock %}
{% block content %}
<section class="panel">
  <div class="panel-head">
    <div><p class="eyebrow">{{ course.title }} / {{ module.title }}</p><h2>{{ title }}</h2></div>
  </div>
  <form method="post" class="contact-form grid-form">
    {% csrf_token %}
    <label>Nomi {{ form.title }}{% if form.title.errors %}<span class="field-error">{{ form.title.errors.0 }}</span>{% endif %}</label>
    <label class="full">Kontent {{ form.content }}</label>
    <label>Video URL {{ form.video_url }}</label>
    <label>Davomiylik (min) {{ form.duration_minutes }}</label>
    <label>Tartib {{ form.sort_order }}</label>
    <label class="check-inline">{{ form.is_published }} Chop etilgan</label>
    <button class="btn btn-primary" type="submit">Saqlash</button>
    <a class="text-link" href="{% url 'portal:admin_module_lessons' module.pk %}">Orqaga</a>
  </form>
</section>
{% endblock %}

{% extends "portal/admin/admin_base.html" %}
{% block title %}{{ title }} — Admin{% endblock %}
{% block content %}
<section class="panel">
  <div class="panel-head"><div><p class="eyebrow">Enrollment</p><h2>{{ title }}</h2></div></div>
  <form method="post" class="contact-form grid-form">
    {% csrf_token %}
    <label>Student {{ form.student }}{% if form.student.errors %}<span class="field-error">{{ form.student.errors.0 }}</span>{% endif %}</label>
    <label>Kurs {{ form.course }}{% if form.course.errors %}<span class="field-error">{{ form.course.errors.0 }}</span>{% endif %}</label>
    <label>Progress % {{ form.progress_percent }}</label>
    <label class="check-inline">{{ form.is_active }} Aktiv</label>
    {% if form.non_field_errors %}<p class="form-status is-error">{{ form.non_field_errors.0 }}</p>{% endif %}
    <button class="btn btn-primary" type="submit">Saqlash</button>
    <a class="text-link" href="{% url 'portal:admin_enrollments' %}">Orqaga</a>
  </form>
</section>
{% endblock %}

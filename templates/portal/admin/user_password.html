{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parol — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700&family=Oxanium:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  <link rel="stylesheet" href="{% static 'css/portal.css' %}" />
</head>
<body class="portal-body">
  <div class="app-shell portal-shell">
    <header class="topbar">
      <a class="brand" href="{% url 'portal:admin_dashboard' %}"><span class="brand-mark">FC</span><span class="brand-text">Admin Panel</span></a>
    </header>
    <aside class="sidebar"><nav class="sidebar-nav">{% include "portal/admin/_sidebar.html" %}</nav></aside>
    <main class="content portal-content">
      <section class="panel narrow-panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Parol</p>
            <h2>{{ target.username }}</h2>
          </div>
        </div>
        <p class="section-lead">Yangi vaqtinchalik parol beriladi. Keyingi kirishda user o‘zi almashtiradi.</p>
        <form method="post" class="contact-form" style="margin-top:1rem">
          {% csrf_token %}
          <label>Vaqtinchalik parol {{ form.temporary_password }}</label>
          <button class="btn btn-primary" type="submit">Parolni o‘rnatish</button>
          <a class="text-link" href="{% url 'portal:admin_users' %}">Orqaga</a>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
